services:
  - type: web
    name: ai-hand-glove-collector
    runtime: python
    plan: free
    rootDir: web
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JETSON_API_TOKEN
        generateValue: true
